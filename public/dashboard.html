<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HackUp · Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">H</div>
        <div class="logo-text">HackUp <span>· track</span></div>
      </div>
      <div class="header-actions">
        <span class="badge"><i class="fas fa-circle"></i> Live</span>
        <button class="btn btn-sm" id="testTelegramBtn"><i class="fab fa-telegram"></i> Test Notification</button>
        <button class="btn btn-primary btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        <a href="/" class="btn btn-sm" style="background: var(--bg-card);"><i class="fas fa-home"></i> Home</a>
      </div>
    </header>

    <!-- Stats -->
    <section class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label"><i class="fas fa-tasks"></i> Total</div><div class="stat-value" id="totalTasks">0</div></div>
      <div class="stat-card"><div class="stat-label"><i class="fas fa-check-circle" style="color: var(--neon-green);"></i> Completed</div><div class="stat-value" id="completedTasks">0</div></div>
      <div class="stat-card"><div class="stat-label"><i class="fas fa-hourglass-half" style="color: var(--neon-yellow);"></i> Pending</div><div class="stat-value" id="pendingTasks">0</div></div>
      <div class="stat-card"><div class="stat-label"><i class="fas fa-clock" style="color: var(--neon-blue);"></i> Activities</div><div class="stat-value" id="activityCount">0</div></div>
    </section>

    <!-- Main Grid -->
    <div class="main-grid">
      <!-- Left: Task List + Add Form -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2 style="font-size: 18px; font-weight: 600;"><i class="fas fa-list-ul" style="color: var(--neon-green);"></i> Tasks</h2>
          <span style="font-size: 13px; color: var(--text-secondary);" id="taskCount">0 tasks</span>
        </div>
        <div class="add-task-form">
          <input type="text" id="taskInput" placeholder="Write a task..." />
          <button id="addTaskBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Add</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </div>

      <!-- Right: Chart + Activity Log -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2 style="font-size: 18px; font-weight: 600;"><i class="fas fa-chart-pie" style="color: var(--neon-blue);"></i> Overview</h2>
        </div>
        <canvas id="statusChart" width="200" height="200"></canvas>
        <hr style="border-color: rgba(0,245,160,0.08); margin: 20px 0;" />
        <h3 style="font-size: 15px; font-weight: 500; margin-bottom: 10px;"><i class="fas fa-history" style="color: var(--neon-purple);"></i> Activity Log</h3>
        <div id="activityLog" class="activity-log"></div>
      </div>
    </div>

    <footer style="text-align: center; margin-top: 30px; color: var(--text-secondary); font-size: 13px; border-top: 1px solid rgba(0,245,160,0.06); padding-top: 20px;">
      <span>HackUp · built with <i class="fas fa-heart" style="color: var(--neon-pink);"></i> by Humayun Shariar Himu</span>
    </footer>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
