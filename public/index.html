<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HackUp · Send Data</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="minimal-container">
    <div class="logo-area" style="margin-bottom: 30px;">
      <div class="logo-icon">H</div>
      <div class="logo-text">HackUp</div>
    </div>
    <button id="sendAllBtn" class="white-btn">
      <i class="fas fa-paper-plane"></i> Send All Data to Telegram
    </button>
    <p id="statusMsg" class="status-msg"></p>
    <p style="margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
      <i class="fas fa-arrow-right"></i> Visit <a href="/dashboard" style="color: var(--neon-blue);">Dashboard</a> for full management
    </p>
  </div>
  <script src="index.js"></script>
</body>
</html>
